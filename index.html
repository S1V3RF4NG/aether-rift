<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether Rift</title>
<style>
:root{--bg:#090b18;--panel:#14182c;--panel2:#1c2240;--line:#30395e;--text:#f4f4ff;--muted:#9da8cc;--violet:#a78bfa;--cyan:#67e8f9;--gold:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#27204e 0,#10152a 42%,#080b16 100%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{border:1px solid #7461c4;background:linear-gradient(135deg,#7654d9,#49369c);color:white;padding:11px 17px;border-radius:12px;font-weight:750;cursor:pointer;box-shadow:0 5px 20px #0005}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#222943;border-color:#414c73}.danger{background:#6c334c;border-color:#a64d6c}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-size:clamp(24px,5vw,38px);font-weight:950;letter-spacing:3px}.brand span{color:var(--violet)}.tag{color:var(--muted);font-size:12px;letter-spacing:2px}.panel{background:linear-gradient(145deg,#171c34ed,#101529ed);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 55px #0005;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.hero{text-align:center;padding:34px 18px}.hero .orb{width:120px;height:120px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f4d8ff,#9464e8 35%,#3c2b76 68%,transparent 72%);filter:drop-shadow(0 0 28px #9b72ff99);font-size:48px}.hero h1{font-size:clamp(32px,7vw,58px);line-height:1.05;margin:8px}.hero p{color:var(--muted)}input{background:#0b1022;border:1px solid #3a456d;border-radius:10px;padding:11px;color:white;min-width:0}input:focus{outline:2px solid var(--violet)}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:170px}.code{font-size:27px;letter-spacing:8px;color:var(--gold);font-weight:900}.monster{border:1px solid var(--line);background:linear-gradient(160deg,#202747,#11172b);border-radius:16px;padding:13px;min-width:0}.monster svg{width:100%;height:118px;display:block}.monster h3{margin:4px 0}.stat{font-size:12px;color:var(--muted)}.pill{display:inline-block;border:1px solid #505b83;border-radius:99px;padding:2px 9px;font-size:11px;color:#d8d8ff}.bar{height:9px;background:#303752;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#61d5ed,#9c83ff)}.hide{display:none!important}.notice{padding:10px 13px;background:#252347;border:1px solid #51488b;border-radius:12px;color:#e7ddff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.list{display:grid;gap:8px}.player{background:#202744;padding:9px 12px;border-radius:10px;display:flex;justify-content:space-between}.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vs{text-align:center;font-weight:900;color:var(--gold);align-self:center}.log{max-height:170px;overflow:auto;background:#0a1020;padding:12px;border-radius:12px;color:#c5cbea;font-size:13px}.foot{color:#6f7899;text-align:center;font-size:11px;padding:22px}
/* Rift polish: motion, impact and readable feedback */
#muteBtn{padding:7px 10px;font-size:12px;border-radius:10px;white-space:nowrap}
.bar i{transition:width .65s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px #8b7cff88}
.monster{position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}
.monster.hit{animation:monsterHit .42s ease}
@keyframes monsterHit{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(-7px) scale(1.025)}55%{transform:translateX(5px) scale(.985)}}
body.rift-shake{animation:riftShake .38s ease}
@keyframes riftShake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.float-fx{position:absolute;left:50%;top:42%;transform:translate(-50%,0);font-weight:1000;font-size:clamp(20px,4vw,34px);color:#fff;text-shadow:0 3px 14px #000,0 0 18px #ff6688;white-space:nowrap;animation:floatUp 1.15s cubic-bezier(.15,.7,.3,1) forwards}
.float-fx.super{top:34%;font-size:clamp(17px,3vw,25px);color:#ffe66d;text-shadow:0 0 18px #ff6b35,0 3px 12px #000;letter-spacing:2px}
@keyframes floatUp{0%{opacity:0;translate:0 18px;scale:.65}15%{opacity:1;scale:1.08}100%{opacity:0;translate:0 -95px;scale:1}}
body.rift-flash:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(circle,#fff9 0%,#b78cff55 35%,transparent 72%);animation:riftFlash .62s ease-out forwards}
@keyframes riftFlash{from{opacity:1}to{opacity:0}}

@media(max-width:600px){.wrap{padding:12px}.panel{padding:15px}.arena{grid-template-columns:1fr}.vs{padding:0}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">AETHER <span>RIFT</span></div><div class="tag">CATCH · FUSE · BATTLE</div></div><div class="row"><span id="userTag" class="muted small"></span><button class="secondary" id="collectionTop">My Riftlings</button><button class="secondary" id="muteBtn" aria-label="Mute sound">♫ Sound: On</button></div></header>
<main id="app"></main><div id="fxLayer" aria-hidden="true"></div><div class="foot">AETHER RIFT · FIRST PLAYABLE BUILD · Room state lives in memory while the server is running.</div></div>
<script>
const $=s=>document.querySelector(s), STORE='aetherRiftSave_v1';
const defs=[
{id:'emberox',name:'Emberox',element:'Fire',color:'#ff7048',kind:'fox'},
{id:'aquaphin',name:'Aquaphin',element:'Water',color:'#56c8ee',kind:'fish'},
{id:'thornfang',name:'Thornfang',element:'Grass',color:'#78d78b',kind:'wolf'},
{id:'hexwraith',name:'Hexwraith',element:'Cursed',color:'#b48cff',kind:'ghost'},
{id:'voidmaw',name:'Voidmaw',element:'Corrupt',color:'#ff4d75',kind:'beast'},
{id:'voltaris',name:'Voltaris',element:'Lightning',color:'#ffe16a',kind:'bird'},
{id:'glacira',name:'Glacira',element:'Ice',color:'#a5e7ff',kind:'dragon'},
{id:'terragorn',name:'Terragorn',element:'Earth',color:'#c6a477',kind:'golem'}];
function art(m){
const id=m.id||'emberox',c=(defs.find(d=>d.id===id)||{}).color||'#a78bfa';
const shapes={
emberox:`<path d="M35 84 Q17 63 34 48 L21 30 49 39 Q55 20 78 32 Q91 13 111 34 L139 23 129 50 Q151 66 131 91 Q111 111 77 103Z"/><path d="M36 76 Q8 79 17 54 Q28 64 34 53 Q22 89 48 91Z" fill="#ffb23f" stroke="#fff0a6"/><path d="M48 96 Q20 113 33 87 Q41 94 51 85" fill="#ff4b2e"/><path d="M62 43 Q79 13 91 42 M106 42 Q125 18 131 49" fill="none" stroke="#ffe0a0" stroke-width="5"/>`,
aquaphin:`<path d="M24 65 Q48 25 91 39 Q124 19 151 60 Q126 103 88 88 Q49 108 24 65Z"/><path d="M77 42 Q65 11 91 23 Q109 11 104 43 M76 83 Q63 111 91 101 Q113 111 109 84" fill="#baf7ff" stroke="#e9ffff"/><path d="M29 65 L9 43 13 66 9 88Z"/><path d="M53 49 Q73 64 53 81 M91 42 Q112 61 91 86" fill="none" stroke="#e8fbff" stroke-width="4"/><path d="M124 45 Q143 57 125 77" fill="none" stroke="#e8fbff" stroke-width="3"/>`,
thornfang:`<path d="M34 87 Q23 62 44 46 L38 20 62 39 Q79 20 96 39 L126 18 123 49 Q149 61 133 88 L111 103 60 104Z"/><path d="M40 59 L20 48 35 75 16 82 47 87 M121 57 L147 43 133 74 157 83 126 90" fill="#a8f09b" stroke="#e6ffbd" stroke-width="3"/><path d="M54 91 Q43 112 66 103 M112 92 Q129 114 135 98" fill="none" stroke="#d8ffb5" stroke-width="6"/><path d="M66 46 L72 57 82 46 92 57 103 45" fill="none" stroke="#174c34" stroke-width="4"/>`,
hexwraith:`<path d="M53 37 Q90 7 127 38 L143 103 119 91 105 111 90 94 73 111 59 91 34 104Z"/><path d="M54 39 Q35 52 48 76 M126 39 Q145 53 132 76" fill="none" stroke="#e8d9ff" stroke-width="5"/><path d="M70 55 Q90 42 110 55 L103 77 Q90 86 77 77Z" fill="#26164a" stroke="#eadcff" stroke-width="2"/><path d="M77 63 L84 59 M96 59 L103 63" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M90 20 L90 5 M47 27 L35 13 M132 27 L145 13" stroke="#d9c3ff" stroke-width="4"/>`,
voidmaw:`<path d="M30 78 L19 47 47 42 54 20 75 36 92 15 109 37 137 27 131 53 153 70 128 101 92 93 61 108Z"/><path d="M49 56 L66 65 80 55 94 66 109 54 126 63 117 86 96 95 73 88Z" fill="#210b23" stroke="#ff8aa9" stroke-width="3"/><path d="M57 60 L68 75 78 62 89 79 101 62 113 76 122 61" fill="#fff0f4" stroke="#fff" stroke-width="2"/><path d="M38 43 L24 25 52 35 M128 42 L151 22 141 53" fill="#ff7696"/>`,
voltaris:`<path d="M58 48 Q80 23 104 44 L115 85 91 101 64 84Z"/><path d="M66 56 Q26 7 12 34 Q31 36 25 65 Q42 48 55 76 M106 55 Q146 7 164 34 Q143 36 151 65 Q132 48 118 76" fill="#ffe77a" stroke="#fff7c2" stroke-width="3"/><path d="M82 45 L91 23 100 47 M89 84 L73 112 94 99 102 116 108 85" fill="#fff7c2"/><path d="M68 59 L82 63 M99 63 L112 59" stroke="#493719" stroke-width="5"/>`,
glacira:`<path d="M38 85 Q25 59 49 42 L69 47 86 24 105 45 131 36 143 69 123 96 90 104 57 99Z"/><path d="M83 39 L89 4 101 35 116 13 111 48 M47 49 L32 22 58 40 M126 51 L151 27 138 61" fill="#d9f8ff" stroke="#fff" stroke-width="3"/><path d="M57 69 L73 61 86 71 101 60 120 70" fill="none" stroke="#eaffff" stroke-width="4"/><path d="M66 96 L54 115 82 105 M113 97 L126 114 101 105" fill="#8ddcf7"/>`,
terragorn:`<path d="M34 88 L25 58 48 40 62 22 82 34 102 18 117 40 145 54 134 88 111 105 59 105Z"/><path d="M47 47 L61 31 78 47 66 64Z M98 43 L115 30 132 53 111 65Z M62 75 L84 61 104 76 96 98 67 96Z" fill="#e2c59a" stroke="#fff0ce" stroke-width="3"/><path d="M27 61 L10 51 25 79 M142 62 L162 51 137 82" fill="#9b7954" stroke="#e8d1ac" stroke-width="3"/><path d="M69 103 L57 116 M111 103 L124 116" stroke="#d6b58a" stroke-width="9" stroke-linecap="round"/>`
};
const eyes=id==='hexwraith'?'<path d="M68 61 L83 61 M97 61 L112 61" stroke="#fff" stroke-width="5" stroke-linecap="round"/>':'<ellipse cx="72" cy="64" rx="6" ry="8" fill="#101326"/><ellipse cx="108" cy="64" rx="6" ry="8" fill="#101326"/><circle cx="74" cy="62" r="2.5" fill="white"/><circle cx="110" cy="62" r="2.5" fill="white"/>';
return `<svg viewBox="0 0 180 120" role="img" aria-label="${m.name}"><defs><radialGradient id="glow-${id}"><stop stop-color="${c}" stop-opacity=".62"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient><filter id="soft-${id}"><feGaussianBlur stdDeviation="3"/></filter></defs><ellipse cx="90" cy="65" rx="76" ry="52" fill="url(#glow-${id})"/><g fill="${c}" stroke="#f5f0ff" stroke-opacity=".82" stroke-width="2.2" stroke-linejoin="round">${shapes[id]||shapes.emberox}</g>${eyes}<path d="M82 83 Q90 88 99 82" fill="none" stroke="#11162b" stroke-width="3" stroke-linecap="round"/></svg>`
}
function starter(){let m=defs[Math.floor(Math.random()*3)];return {id:m.id,name:m.name,element:m.element,level:1,xp:0,hp:100,attack:20}}
function load(){try{let s=JSON.parse(localStorage.getItem(STORE));if(s&&s.playerId&&Array.isArray(s.monsters))return s}catch{}let s={playerId:'p_'+crypto.randomUUID(),username:'',shards:0,monsters:[starter()]};localStorage.setItem(STORE,JSON.stringify(s));return s}
let save=load(),room=null,view='home',poller=null,lastState=null,selected=null;
let audioCtx=null,muted=localStorage.getItem('aetherRiftMuted')==='1';
function audio(){if(muted)return null;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}
function tone(freq,duration=.12,type='sine',gain=.07,when=0,slide=0){let c=audio();if(!c)return;let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+.03)}
function noise(duration=.16,gain=.1,cut=900){let c=audio();if(!c)return;let n=Math.floor(c.sampleRate*duration),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.value=gain;src.connect(f);f.connect(g);g.connect(c.destination);src.start()}
function sfx(kind){if(muted)return;switch(kind){case'click':tone(540,.045,'square',.025,-0,.0);break;case'lure':tone(330,.12,'sine',.07,0,280);tone(660,.18,'triangle',.045,.09,420);break;case'catch':tone(660,.1,'sine',.07);tone(880,.13,'sine',.07,.1);tone(1180,.2,'triangle',.06,.22);break;case'fuse':[523,659,784,1047].forEach((f,i)=>tone(f,.28,'sine',.065,i*.09,120));break;case'attack':noise(.13,.13,1200);tone(155,.18,'sawtooth',.07,0,-65);break;case'super':noise(.28,.23,650);tone(90,.3,'sawtooth',.12,0,-45);tone(220,.2,'square',.05,.06,-100);break;case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.42,'triangle',.07,i*.16,80));break}}
function fx(text,kind=''){let layer=$('#fxLayer');if(!layer)return;let el=document.createElement('div');el.className='float-fx '+kind;el.textContent=text;layer.appendChild(el);setTimeout(()=>el.remove(),1250)}
function flash(shake=false){document.body.classList.remove('rift-flash','rift-shake');void document.body.offsetWidth;document.body.classList.add('rift-flash');if(shake)document.body.classList.add('rift-shake');setTimeout(()=>document.body.classList.remove('rift-flash','rift-shake'),700)}
function toggleMute(){muted=!muted;localStorage.setItem('aetherRiftMuted',muted?'1':'0');syncMute()}
function syncMute(){let b=$('#muteBtn');if(b){b.textContent=muted?'♫ Sound: Off':'♫ Sound: On';b.setAttribute('aria-label',muted?'Unmute sound':'Mute sound')}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='muteBtn'){toggleMute();return}if(!b.disabled)sfx('click')},true);
function compareBattleEffects(prev,next){if(!prev||!next)return;if(prev.phase!=='results'&&next.phase==='results'){let top=Math.max(0,...Object.values(next.scores||{}));if((next.scores||{})[save.playerId]===top&&top>0){sfx('win');fx('MATCH CHAMPION!','super');flash(true)}}if(!prev.battles||!next.battles)return;for(const id of Object.keys(next.battles)){let a=prev.battles[id],b=next.battles[id];if(!a||!b||!a.fighters||!b.fighters)continue;for(const pid of Object.keys(b.fighters)){let before=a.fighters[pid],after=b.fighters[pid];if(before&&after&&after.hp<before.hp){let dmg=before.hp-after.hp;fx(`-${dmg}!`);let attacker=Object.keys(b.fighters).find(k=>k!==pid);let atk=b.fighters[attacker];let effective=atk&&((atk.element==='Fire'&&after.element==='Grass')||(atk.element==='Grass'&&after.element==='Water')||(atk.element==='Water'&&after.element==='Fire')||atk.element==='Corrupt'||after.element==='Corrupt');if(effective){fx('SUPER EFFECTIVE!','super');sfx('super')}else sfx('attack');flash(true);document.querySelectorAll('.arena .monster').forEach(el=>{el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')})}}if(!a.winner&&b.winner){if(b.winner===save.playerId){sfx('win');fx('VICTORY!','super');flash(true)}}}}

function persist(){localStorage.setItem(STORE,JSON.stringify(save));$('#userTag').textContent=save.username||'New player'}
function toast(t){let n=$('#toast');if(n){n.textContent=t;n.classList.remove('hide');setTimeout(()=>n.classList.add('hide'),2600)}}
async function api(path,data={}){let r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function head(title,sub=''){return `<div class="row spread"><div><h2>${title}</h2><div class="muted small">${sub}</div></div><div id="toast" class="notice hide"></div></div>`}
function home(){view='home';stopPoll();$('#app').innerHTML=`<section class="panel hero"><div class="orb">✦</div><div class="tag">THE RIFT IS OPEN</div><h1>Build your <span style="color:var(--violet)">legend.</span></h1><p>Catch elemental Riftlings, fuse duplicates and challenge your friends.</p><div class="grid" style="max-width:620px;margin:24px auto"><div class="field"><label>Username</label><input id="username" maxlength="16" placeholder="Enter your name" value="${esc(save.username)}"></div><div class="field"><label>Room code</label><input id="roomcode" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"></div></div><div class="actions" style="justify-content:center"><button id="create">Create Room</button><button class="secondary" id="join">Join Room</button><button class="secondary" id="collection">My Collection</button></div></section><section class="panel"><h2>How to Play</h2><div class="grid"><div><b>1 · Create or Join</b><p class="muted small">Host a room or enter a friend's four-letter code. Play with 2–8 players.</p></div><div><b>2 · Hunt for 25 seconds</b><p class="muted small">Cast lures to catch random Riftlings. Duplicates fuse into higher levels.</p></div><div><b>3 · Build your team</b><p class="muted small">Keep your collection between matches. Spend shards to upgrade a favorite.</p></div><div><b>4 · Battle</b><p class="muted small">Pick a Riftling and use Basic Attack or Elemental Skill. Three rounds decide the champion.</p></div></div><div class="notice small">Fire beats Grass · Grass beats Water · Water beats Fire (1.5×). Cursed applies damage over time. Corrupt deals 2× damage but takes 1.5× damage.</div></section><section class="panel"><div class="row spread"><b>Your permanent collection</b><span class="pill">${save.monsters.length} species · ${save.shards} shards</span></div><div class="grid">${save.monsters.map(card).join('')}</div></section>`;
$('#create').onclick=()=>createRoom();$('#join').onclick=()=>joinRoom();$('#collection').onclick=collection;$('#collectionTop').onclick=collection}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(m,upgrade=false){return `<div class="monster">${art(m)}<div class="row spread"><h3>${m.name}</h3><span class="pill">${m.element}</span></div><div class="stat">Level ${m.level} · HP ${m.hp} · ATK ${m.attack} · XP ${m.xp||0}</div>${upgrade?`<button class="secondary" data-up="${m.id}" style="width:100%;margin-top:10px" ${m.level>=10||save.shards<30+m.level*20?'disabled':''}>Upgrade · ${30+m.level*20} shards</button>`:''}</div>`}
async function ensureName(){let n=$('#username')?.value.trim()||save.username;if(!n){throw Error('Enter a username first.')}save.username=n;persist();return n}
async function createRoom(){try{await ensureName();let r=await api('create',{player:save});room=r.code;startPoll();renderRoom()}catch(e){alert(e.message)}}
async function joinRoom(){try{await ensureName();let r=await api('join',{code:$('#roomcode').value.toUpperCase(),player:save});room=r.code;startPoll();renderRoom()}catch(e){alert(e.message)}}
function stopPoll(){if(poller)clearInterval(poller);poller=null}
function startPoll(){stopPoll();poller=setInterval(async()=>{if(!room)return;try{let s=await api('state',{code:room,playerId:save.playerId});if(s.save){save=s.save;persist()}compareBattleEffects(lastState,s);lastState=s;renderRoom()}catch(e){toast(e.message)}},900)}
async function act(action,extra={}){try{if(action==='catch')sfx('lure');let r=await api('action',{code:room,playerId:save.playerId,action,...extra});if(r.save){save=r.save;persist()}if(r.message)toast(r.message);if(action==='catch'){if((r.message||'').toLowerCase().includes('fusion')){sfx('fuse');fx('FUSION!','super')}else{sfx('catch');fx('RIFTLING CAUGHT!');}flash()}if(action==='upgrade'){sfx('fuse');fx('LEVEL UP!','super');flash()}if(action==='attack'){compareBattleEffects(lastState,r.state)}if(r.state){lastState=r.state;renderRoom()}}catch(e){alert(e.message)}}
function renderRoom(){if(!lastState)return;let s=lastState,me=s.players.find(p=>p.playerId===save.playerId);if(!me){home();return}view='room';let host=s.hostId===save.playerId;let body='';
if(s.phase==='lobby'){body=`${head('Rift Lobby','Gather your party before the hunt begins.')}<div class="panel"><div class="row spread"><div><div class="muted small">ROOM CODE</div><div class="code">${s.code}</div></div><span class="pill">${s.players.length}/8 PLAYERS</span></div><div class="list" style="margin-top:16px">${s.players.map(p=>`<div class="player"><span>${esc(p.username)} ${p.playerId===s.hostId?'👑':''}</span><span class="muted small">${p.playerId===save.playerId?'YOU':'READY'}</span></div>`).join('')}</div><div class="actions">${host?`<button id="start" ${s.players.length<2?'disabled':''}>Start Match</button>`:''}<button class="secondary" id="leave">Leave Room</button></div>${s.players.length<2?'<p class="muted small">Need at least 2 players to start. Open another tab or device to test multiplayer.</p>':''}</div>`}
else if(s.phase==='hunt'){body=`${head('Hunt Phase',`Round ${s.round}/3 · Catch as many Riftlings as you can`)}<div class="panel hero"><div class="tag">TIME REMAINING</div><div style="font-size:58px;font-weight:950;color:var(--gold)">${s.remaining}s</div><p>Cast a Rift Lure to discover a random Riftling.</p><button id="lure">✦ Cast Rift Lure</button><div class="muted small" style="margin-top:10px">Every catch is saved permanently. Duplicates automatically fuse.</div></div><div class="panel"><div class="row spread"><b>Your collection</b><span class="pill">${save.monsters.length} monsters</span></div><div class="grid">${save.monsters.map(m=>card(m,true)).join('')}</div></div>`}
else if(s.phase==='battle'){let pair=s.pairs.find(p=>p.a===save.playerId||p.b===save.playerId);if(!pair)pair={a:save.playerId,b:'bot',bot:true};let opponent=s.players.find(p=>p.playerId===(pair.a===save.playerId?pair.b:pair.a));let battle=s.battles[pair.id];let own=battle?.fighters?.[save.playerId],enemy=battle?.fighters?.[pair.a===save.playerId?pair.b:pair.a];body=`${head('Battle Arena',`Round ${s.round}/3 · ${pair.bot?'Rift Guardian Bot':'Head-to-head duel'}`)}<div class="panel"><div class="arena"><div class="monster">${own?art({...defs.find(d=>d.id===own.id),name:own.name}):''}<h3>${own?.name||'Choose your Riftling'}</h3><div class="stat">HP ${own?.hp??'—'} / ${own?.maxHp??'—'}</div><div class="bar"><i style="width:${own?100*own.hp/own.maxHp:0}%"></i></div></div><div class="vs">VS</div><div class="monster">${enemy?art({...defs.find(d=>d.id===enemy.id),name:enemy.name}):''}<h3>${enemy?.name||opponent?.username||'Rift Guardian Bot'}</h3><div class="stat">HP ${enemy?.hp??'—'} / ${enemy?.maxHp??'—'}</div><div class="bar"><i style="width:${enemy?100*enemy.hp/enemy.maxHp:0}%"></i></div></div></div>${!battle?.fighters?.[save.playerId]?`<h3>Choose your fighter</h3><div class="grid">${save.monsters.map(m=>`<div class="monster">${art(m)}<b>${m.name} · Lv.${m.level}</b><button data-pick="${m.id}" style="width:100%;margin-top:8px">Select</button></div>`).join('')}</div>`:battle?.winner?`<div class="notice" style="margin-top:14px">${battle.winner===save.playerId?'Victory!':'Battle complete.'} ${battle.winner==='bot'?'The Rift Guardian Bot wins.':''} Waiting for next round…</div>`:`<div class="actions"><button id="basic" ${battle.turn!==save.playerId?'disabled':''}>Basic Attack</button><button id="skill" ${battle.turn!==save.playerId?'disabled':''}>Elemental Skill</button></div><p class="muted small">Turn: ${battle.turn===save.playerId?'Your move':battle.turn==='bot'?'Rift Guardian Bot':opponent?.username||'Opponent'}</p>`}</div><div class="panel"><b>Battle Log</b><div class="log">${(battle?.log||['The arena is ready.']).slice(-8).map(esc).join('<br>')}</div></div>`}
else{body=`${head('Match Complete','The rift settles…')}<div class="panel"><h2>🏆 Match Results</h2><div class="list">${s.players.slice().sort((a,b)=>(s.scores[b.playerId]||0)-(s.scores[a.playerId]||0)).map((p,i)=>`<div class="player"><span>${i+1}. ${esc(p.username)}</span><b>${s.scores[p.playerId]||0} pts</b></div>`).join('')}</div><div class="actions"><button id="home">Return Home</button><button class="secondary" id="again">New Match</button></div></div>`}
$('#app').innerHTML=body;if($('#start'))$('#start').onclick=()=>act('start');if($('#leave'))$('#leave').onclick=()=>{room=null;stopPoll();home()};if($('#lure'))$('#lure').onclick=()=>act('catch');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>act('upgrade',{monsterId:b.dataset.up}));document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>act('pick',{monsterId:b.dataset.pick}));if($('#basic'))$('#basic').onclick=()=>act('attack',{skill:false});if($('#skill'))$('#skill').onclick=()=>act('attack',{skill:true});if($('#home'))$('#home').onclick=home;if($('#again'))$('#again').onclick=home}
function collection(){view='collection';stopPoll();$('#app').innerHTML=`${head('My Riftlings','Your collection persists on this browser across matches.')}<div class="panel"><div class="row spread"><div><b>${save.monsters.length} owned Riftlings</b><div class="muted small">${save.shards} Rift Shards available</div></div><button class="secondary" id="back">Back</button></div><div class="grid" style="margin-top:14px">${save.monsters.map(m=>card(m,true)).join('')}</div></div>`;$('#back').onclick=home;document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let m=save.monsters.find(x=>x.id===b.dataset.up),cost=30+m.level*20;if(m&&m.level<10&&save.shards>=cost){save.shards-=cost;m.level++;m.hp=Math.round(m.hp*1.2);m.attack=Math.round(m.attack*1.15);persist();collection()}})}
persist();syncMute();home();
</script></body></html>
